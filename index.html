<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04452D">
<meta name="description" content="NutriLoop: Gujarati veg meal plans, calories, protein, water and gentle fitness reminders. Little habits. Better days.">
<title>NutriLoop</title>
<!-- Bump on every release: shown in the "new version" pop-up -->
<meta name="nl-version" content="1.0.0">
<meta name="nl-notes" content="First version: meal plans, food log, water, reminders and progress.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
/* NutriLoop 1.0: forest green from the logo, lime + aqua accents, Inter, Lucide line icons. Calm, no busy animation. */
@font-face{font-family:'Inter';src:url(assets/inter.woff2) format('woff2'),url(https://imshyamalbhatt.github.io/nutriloop/assets/inter.woff2) format('woff2');font-weight:400 800;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+2212}
@font-face{font-family:'Inter';src:url(assets/inter-ext.woff2) format('woff2'),url(https://imshyamalbhatt.github.io/nutriloop/assets/inter-ext.woff2) format('woff2');font-weight:400 800;font-display:swap;unicode-range:U+0100-024F,U+20A0-20C0}
:root{
  --brand:#0C9A5B;--brand-deep:#05462E;--brand-soft:#E5F5EC;--lime:#B5EE4F;--aqua:#13B5C8;--water:#0B93D6;--water-soft:#E3F3FB;
  --ink:#0E1F17;--muted:#5A6A62;--bg:#F2F6F3;--card:#FFFFFF;--line:#DFE8E2;--chip:#ECF2EE;
  --coral:#E0484D;--warn:#C27C00;--warn-soft:#FBF1DD;
  --prot:#5B5BD6;--carb:#D9900F;--fat:#D8577A;--fib:#109A86;
  --hdr1:#0A5C3C;--hdr2:#03301F;
  --ui:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#35D38A;--brand-deep:#1FA36A;--brand-soft:#0F2E21;--lime:#C3F36B;--aqua:#3FD0DF;--water:#4CB8EE;--water-soft:#0D2733;--ink:#E4EFE9;--muted:#93A79D;--bg:#07120D;--card:#0F1D17;--line:#1C2E25;--chip:#16261E;--coral:#F27075;--warn:#E8A93A;--warn-soft:#2B2210;--prot:#9A9AF5;--carb:#F0B44A;--fat:#F08AA5;--fib:#3FCDB7;color-scheme:dark}}
:root[data-theme="dark"]{--brand:#35D38A;--brand-deep:#1FA36A;--brand-soft:#0F2E21;--lime:#C3F36B;--aqua:#3FD0DF;--water:#4CB8EE;--water-soft:#0D2733;--ink:#E4EFE9;--muted:#93A79D;--bg:#07120D;--card:#0F1D17;--line:#1C2E25;--chip:#16261E;--coral:#F27075;--warn:#E8A93A;--warn-soft:#2B2210;--prot:#9A9AF5;--carb:#F0B44A;--fat:#F08AA5;--fib:#3FCDB7;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html.lock,html.lock body{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit;font-size:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:20px;height:20px;flex:none;vertical-align:middle}
[hidden]{display:none!important}
h2,h3,p{margin:0}

/* header */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.top-row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.top-logo{width:32px;height:32px;border-radius:8px;flex:none}
.wordmark{font-weight:700;font-size:20px;line-height:1;letter-spacing:-.01em}
.wordmark span{color:var(--lime)}
:root[data-theme="dark"] .wordmark span{color:#C3F36B}
.top-row .grow{flex:1}
.daynav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.daynav button{background:rgba(255,255,255,.14);border:0;color:#fff;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.daynav button:disabled{opacity:.35}
.daynav .dlabel{min-width:150px;text-align:center;font-weight:600;font-size:15px;background:none;border-radius:8px;width:auto;height:auto;padding:4px 8px}
.top-title{font-weight:600;font-size:15px;opacity:.9}

main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card-head h3{font-size:16px;font-weight:700}
.label{font-size:13px;color:var(--muted);font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.big{font-size:28px;font-weight:700;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#04261A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#04261A}}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--coral);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn svg.i{width:18px;height:18px}
.icon-btn{border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg.i{width:18px;height:18px}
.link-btn{border:0;background:none;color:var(--brand);font-weight:600;padding:8px 0;display:inline-flex;align-items:center;gap:6px}

/* chips + fields */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.chips.days .chip{width:40px;height:40px;padding:0;justify-content:center}
.opt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt .oi{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--brand)}
.opt.on .oi{background:var(--card)}
.opt b{display:block;font-size:15px}
.opt span{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:10px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
.fld input:focus{outline:none;border-color:var(--brand)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.note{background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.note svg.i{color:var(--brand);margin-top:1px}
.err-text{color:var(--coral);font-size:14px;font-weight:600;min-height:20px;margin:4px 0}

/* switch */
.sw{position:relative;width:46px;height:28px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:var(--brand)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}

/* list rows (settings) */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .lic{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--brand)}
.li .lic svg.i{width:18px;height:18px}
.li b{display:block;font-weight:600;font-size:15px}
.li small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.li .val{color:var(--muted);font-size:14px;font-weight:600}
.li .chev{color:var(--muted)}
.li .info{border:0;background:none;color:var(--muted);padding:4px;display:grid}
.li.danger b{color:var(--coral)}
.li.danger .lic{color:var(--coral)}

/* home: hero ring */
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--chip)}
.ring .val{stroke:var(--brand);transition:stroke-dashoffset .4s}
.ring.over .val{stroke:var(--warn)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid b{font-size:26px;line-height:1.05}
.ring .mid span{font-size:12px;color:var(--muted);font-weight:600}
.hero-stats{flex:1;display:grid;gap:10px}
.hs{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.hs span{color:var(--muted)}
.hs b{font-size:16px}
.daytype{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--chip);border:0;border-radius:12px;padding:10px 12px;width:100%;text-align:left}
.daytype .dti{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--card);color:var(--brand);flex:none}
.daytype b{font-size:14px;display:block}
.daytype small{font-size:12px;color:var(--muted)}
.daytype .sw-txt{font-size:13px;font-weight:600;color:var(--brand)}

/* macro bars */
.macros{display:grid;gap:12px}
.mac-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.mac-top b{font-weight:600}
.mac-top span{color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* water */
.water-amt{display:flex;align-items:baseline;gap:6px}
.water-amt b{font-size:28px;color:var(--water)}
.water .bar{height:10px;margin:10px 0 12px;background:var(--water-soft)}
.water .bar i{background:var(--water)}
.water-btns{display:flex;gap:8px}
.water-btns .btn{flex:1;background:var(--water-soft);color:var(--water)}
.water-btns .icon-btn{width:44px;height:44px;border-radius:12px}

/* habits */
.habits{display:grid;gap:2px}
.hab{display:flex;align-items:center;gap:12px;padding:8px 0;border:0;background:none;width:100%;text-align:left}
.hab .hc{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.hab.done .hc{background:var(--brand);border-color:var(--brand)}
.hab .hc svg.i{width:15px;height:15px;stroke-width:3}
.hab b{font-weight:600;font-size:14px}
.hab small{display:block;color:var(--muted);font-size:12px}
.score-pill{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:4px 10px}

/* meals list */
.slot{border-top:1px solid var(--line);padding:12px 0}
.slot:first-of-type{border-top:0;padding-top:2px}
.slot-head{display:flex;align-items:center;gap:10px}
.slot-ic{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--brand)}
.slot-ic svg.i{width:18px;height:18px}
.slot-head b{font-size:15px}
.slot-head small{display:block;font-size:12px;color:var(--muted)}
.slot-items{margin:8px 0 0 44px}
.it{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:6px 0;text-align:left;font-size:14px}
.it span{color:var(--muted);white-space:nowrap}
.idea{margin:8px 0 0 44px;font-size:13px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px}
.idea b{color:var(--ink);font-weight:600}
.idea .ib{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* meal plan cards */
.plan-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.ps{background:var(--chip);border-radius:12px;padding:10px 12px}
.ps span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.ps b{font-size:17px}
.pitems{margin:10px 0 12px;display:grid;gap:6px}
.pit{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.pit span{color:var(--muted);white-space:nowrap}
.pfoot{display:flex;gap:8px;align-items:center}
.pfoot .grow{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.badge.mid{background:var(--warn-soft);color:var(--warn)}
.badge.low{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ti{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.boost{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.boost:first-of-type{border-top:0}

/* progress */
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.c-grid{stroke:var(--line);stroke-width:1}
.c-axis{fill:var(--muted);font-size:10px;font-family:var(--ui)}
.c-axis.today{fill:var(--ink);font-weight:700}
.c-line{stroke:var(--brand);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--brand);opacity:.08}
.c-dot{fill:var(--brand);stroke:var(--card);stroke-width:2}
.c-bar{fill:var(--brand)}
.c-bar.dim{fill:var(--brand);opacity:.35}
.c-target{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.c-tlabel{fill:var(--muted);font-size:10px;font-weight:600;font-family:var(--ui)}
.c-cross{stroke:var(--muted);stroke-width:1}
.tipbox{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st{background:var(--chip);border-radius:12px;padding:10px}
.st b{display:block;font-size:17px}
.st span{font-size:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 8px}

/* me */
.prof{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:22px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.prof b{font-size:17px;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:600;background:var(--chip);border-radius:999px;padding:3px 9px;color:var(--muted)}
.foot-note{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 4px}
.foot-note img{width:36px;height:36px;border-radius:9px;display:block;margin:0 auto 6px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 4px;min-width:60px}
.nav button.on{color:var(--brand)}
.nav .fab{width:54px;height:54px;border-radius:18px;background:var(--brand);color:#fff;min-width:0;margin-top:-22px;box-shadow:0 6px 16px rgba(5,70,46,.35);justify-content:center}
:root[data-theme="dark"] .nav .fab{color:#04261A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav .fab{color:#04261A}}
.nav .fab svg.i{width:26px;height:26px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(3,20,13,.5);opacity:0;transition:opacity .2s}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease-out}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.tall .sheet{height:92vh}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheet-head h3{font-size:18px;font-weight:700}
.sheet-body{padding:6px 16px 16px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg)}
.sheet-foot .btn{flex:1}

/* add food */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:12px 0}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:12px 0;outline:none;min-width:0}
.search svg.i{color:var(--muted)}
.flist-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 6px}
.frow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:6px;width:100%;text-align:left}
.frow b{display:block;font-size:14px;font-weight:600}
.frow small{color:var(--muted);font-size:12px}
.frow .fadd{width:36px;height:36px;border-radius:10px;border:0;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 6px}
.qty .icon-btn{width:48px;height:48px}
.qty b{font-size:32px;min-width:70px;text-align:center}
.qty-unit{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}
.nut4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.n4{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.n4 b{display:block;font-size:16px}
.n4 span{font-size:11px;color:var(--muted);font-weight:600}
.verdict{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.vnum{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;background:var(--brand-soft);color:var(--brand)}
.vnum.mid{background:var(--warn-soft);color:var(--warn)}
.vnum.low{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}

/* reminder rows */
.rem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rem-top{display:flex;align-items:center;gap:12px}
.rem-top .lic{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--brand)}
.rem-top b{display:block;font-size:15px;font-weight:600}
.rem-top small{display:block;color:var(--muted);font-size:12px}
.rem-opts{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:10px}
.rem-opts .fld{margin:0}
.rem-opts .fld input{padding:9px 12px}
.rem.off .rem-opts{display:none}

/* full screens: splash, welcome, setup */
.full{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;overflow-y:auto}
.deep{background:linear-gradient(160deg,#0A5C3C 0%,#04402A 55%,#022417 100%);color:#fff}
#splash{align-items:center;justify-content:center;text-align:center;transition:opacity .3s;z-index:40}
#splash.out{opacity:0}
#splash img{width:104px;height:104px;border-radius:26px}
.sp-name{font-size:30px;font-weight:700;margin-top:18px;letter-spacing:-.01em}
.sp-name span,.wl-name span{color:#C3F36B}
.sp-tag{margin-top:6px;font-size:15px;opacity:.8}
#welcome{padding:calc(40px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center}
#welcome .wl-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
#welcome img{width:92px;height:92px;border-radius:24px}
.wl-name{font-size:28px;font-weight:700;margin-top:16px}
.wl-tag{font-size:20px;font-weight:600;margin-top:22px;line-height:1.3}
.wl-p{font-size:15px;opacity:.8;margin-top:10px;max-width:320px}
.wl-feats{display:grid;gap:10px;margin-top:26px;text-align:left;width:100%;max-width:330px}
.wl-feats div{display:flex;gap:12px;align-items:center;font-size:14px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.wl-feats svg.i{color:#C3F36B}
.gbtn{background:#fff;color:#1F1F1F;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:360px;margin:0 auto}
.gbtn svg{width:20px;height:20px}
.skip{background:none;border:0;color:#fff;opacity:.75;font-weight:600;padding:14px;margin-top:4px}
.wl-legal{font-size:12px;opacity:.6;margin-top:6px}
#setup{background:var(--bg);color:var(--ink)}
.su-top{padding:calc(14px + env(safe-area-inset-top)) 20px 6px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:1}
.su-prog{flex:1;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.su-prog i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s}
.su-body{padding:14px 20px 20px;flex:1;max-width:560px;width:100%;margin:0 auto}
.su-body h2{font-size:24px;font-weight:700;line-height:1.25;margin-bottom:6px}
.su-body h2 span{color:var(--brand)}
.su-body .lead{color:var(--muted);margin-bottom:20px}
.su-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;position:sticky;bottom:0;background:var(--bg)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.tg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tg span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.tg b{font-size:22px}
.tg small{color:var(--muted);font-size:13px}
.tg.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.tg.wide .big{color:var(--brand)}

/* dialog + toast + fake notification (laptop preview) */
.dlg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg-bg{position:absolute;inset:0;background:rgba(3,20,13,.55)}
.dlg-box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg-box h3{font-size:18px;font-weight:700;margin-bottom:8px}
.dlg-body{font-size:14px;color:var(--muted);line-height:1.5}
.dlg-body p+p{margin-top:8px}
.dlg-body b{color:var(--ink)}
.dlg-acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.dlg-acts .btn{flex:1}
.dlg-acts.stack{flex-direction:column}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0E1F17;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;width:max-content}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#C3F36B;font-weight:700;padding:0}
.nbar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:70;background:var(--card);color:var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:12px;transform:translateY(-140%);transition:transform .3s ease-out;max-width:560px;margin:0 auto;border:1px solid var(--line)}
.nbar.show{transform:none}
.nbar img{width:36px;height:36px;border-radius:9px;flex:none}
.nbar .nb-app{font-size:11px;color:var(--muted);font-weight:600}
.nbar b{display:block;font-size:14px;margin-top:1px}
.nbar p{font-size:13px;color:var(--muted);margin-top:2px}
.nbar .nb-acts{display:flex;gap:16px;margin-top:8px}
.nbar .nb-acts button{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;padding:0}
</style>
</head>

function healthScore(f) {

}

const MET = { gym: 5, home: 4, walk: 3.5, run: 8, yoga: 2.5, cycle: 6, sport: 6, swim: 6, none: 0 };
const EX_NAME = { gym: 'Gym', home: 'Home workout', walk: 'Walking', run: 'Running', yoga: 'Yoga', cycle: 'Cycling', sport: 'Sports', swim: 'Swimming', none: 'Not yet' };
const ACT = { desk: 1.25, feet: 1.4, heavy: 1.6 };
const GOALS = { lose: 'Lose fat', fit: 'Stay fit', gain: 'Build muscle' };
function isWorkout(date) {
  const L = db.logs[date], P = db.profile;
  if (L && L.workout != null) return L.workout;
  return P.exType !== 'none' && P.exDays.includes(parseYmd(date).getDay());
}
function targets(date) {
  const P = db.profile, w = +P.weightKg, h = +P.heightCm, a = +P.age;
  const bmr = 10 * w + 6.25 * h - 5 * a + (P.gender === 'm' ? 5 : P.gender === 'f' ? -161 : -78);
  const base = bmr * ACT[P.activity];
  const adj = P.goal === 'lose' ? -Math.min(500, base * .2) : P.goal === 'gain' ? 300 : 0;
  const workout = date ? isWorkout(date) : false;
  const met = MET[P.exType] || 5;
  const burn = workout ? (met - 1) * w * (+P.exMins / 60) : 0;
  const eatBack = { lose: .5, fit: .8, gain: 1 }[P.goal];
  const floor = P.gender === 'f' ? 1200 : 1500;
  const kcal = Math.max(floor, Math.round((base + adj + burn * eatBack) / 10) * 10);
  const hm = h / 100, bmi = w / (hm * hm);
  const refW = bmi > 25 ? 25 * hm * hm : w;
  let perKg = { lose: 1.5, fit: 1.2, gain: 1.7 }[P.goal]; if (P.exType === 'none') perKg -= .2;
  const p = Math.round(Math.min(refW * perKg, kcal * .35 / 4));
  const f = Math.round(kcal * .27 / 9);
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  const fb = Math.round(clamp(kcal / 1000 * 14, 25, 40));
  const water = clamp(Math.round(w * 35 / 250) * 250, 2000, 4000) + (workout ? 500 : 0);
  return { kcal, p, c, f, fb, water, bmr: r0(bmr), base: r0(base), adj: r0(adj), burn: r0(burn * eatBack), workout, perKg, bmi };
}

}

// Single-series charts: brand colour marks, recessive grid, target as a dashed reference line, tap/hover tooltip.
function weightChart(ws, goal) {
  const W = 340, H = 150, L = 30, R = 12, Tp = 14, B = 22;
  const t0 = parseYmd(ws[0].date).getTime(), t1 = parseYmd(ws[ws.length - 1].date).getTime(), span = Math.max(t1 - t0, 864e5);
  let lo = Math.min(...ws.map(w => w.kg)), hi = Math.max(...ws.map(w => w.kg));
  if (goal && goal > lo - 4 && goal < hi + 4) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  lo = Math.floor(lo - .5); hi = Math.ceil(hi + .5);
  const x = d => L + (parseYmd(d).getTime() - t0) / span * (W - L - R), y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);
  const pts = ws.map(w => [x(w.date), y(w.kg)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const ticks = [lo, (lo + hi) / 2, hi];
  const last = pts[pts.length - 1];
  const tips = ws.map((w, i) => ({ x: pts[i][0], y: pts[i][1], t: `${shortDate(w.date)} · ${w.kg.toFixed(1)} kg` }));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${ws[0].kg} to ${ws[ws.length - 1].kg} kg" data-tips='${JSON.stringify(tips)}' data-h="${H - B}" data-top="${Tp}">
    ${ticks.map(v => `<line class="c-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="c-axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${(+v).toFixed(v % 1 ? 1 : 0)}</text>`).join('')}
    ${goal && goal >= lo && goal <= hi ? `<line class="c-target" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/><text class="c-tlabel" x="${W - R}" y="${y(goal) - 5}" text-anchor="end">Goal ${goal} kg</text>` : ''}
    <path class="c-area" d="${line} L${last[0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z"/>
    <path class="c-line" d="${line}"/>
    <circle class="c-dot" cx="${last[0]}" cy="${last[1]}" r="4.5"/>
    <text class="c-axis" x="${L}" y="${H - 6}">${shortDate(ws[0].date)}</text><text class="c-axis" x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(ws[ws.length - 1].date)}</text>
    <line class="c-cross" x1="0" x2="0" y1="${Tp}" y2="${H - B}" visibility="hidden"/>
  </svg>`;
}
function weekChart(wd) {
  const W = 340, H = 150, L = 30, R = 12, Tp = 16, B = 22;
  const hi = Math.max(...wd.map(x => Math.max(x.t.kcal, x.T.kcal))) * 1.1 || 2500;
  const y = v => Tp + (1 - v / hi) * (H - Tp - B), bw = (W - L - R) / 7, w = Math.min(28, bw * .58);
  const target = wd[wd.length - 1].T.kcal;
  const tips = wd.map((x, i) => ({ x: L + bw * i + bw / 2, y: y(x.t.kcal), t: `${DOW[parseYmd(x.d).getDay()]} ${shortDate(x.d)} · ${fmt(x.t.kcal)} kcal · ${r0(x.t.p)} g protein` }));
  const bar = (x0, top, bottom) => { const h = bottom - top; if (h < 1) return ''; const r = Math.min(4, h); return `M${x0} ${bottom} V${top + r} Q${x0} ${top} ${x0 + r} ${top} H${x0 + w - r} Q${x0 + w} ${top} ${x0 + w} ${top + r} V${bottom} Z`; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories for the last 7 days" data-tips='${JSON.stringify(tips)}' data-h="${H - B}" data-top="${Tp}">
    ${[0, .5, 1].map(f => `<line class="c-grid" x1="${L}" x2="${W - R}" y1="${y(hi * f / 1.1)}" y2="${y(hi * f / 1.1)}"/><text class="c-axis" x="${L - 6}" y="${y(hi * f / 1.1) + 3}" text-anchor="end">${f ? (hi * f / 1.1 / 1000).toFixed(1) + 'k' : '0'}</text>`).join('')}
    ${wd.map((x, i) => { const x0 = L + bw * i + (bw - w) / 2; return `<path class="c-bar ${x.d === today() ? 'dim' : ''}" d="${bar(x0, y(x.t.kcal), y(0))}"/><text class="c-axis ${x.d === today() ? 'today' : ''}" x="${x0 + w / 2}" y="${H - 6}" text-anchor="middle">${x.d === today() ? 'Today' : DOW[parseYmd(x.d).getDay()][0]}</text>`; }).join('')}
    <line class="c-target" x1="${L}" x2="${W - R}" y1="${y(target)}" y2="${y(target)}"/><text class="c-tlabel" x="${W - R}" y="${y(target) - 5}" text-anchor="end">Target ${fmt(target)}</text>
    <line class="c-cross" x1="0" x2="0" y1="${Tp}" y2="${H - B}" visibility="hidden"/>
  </svg>`;
}
function wireChart(sel) {
  const box = $(sel); if (!box) return;
  const svg = $('svg', box), tips = JSON.parse(svg.dataset.tips), cross = $('.c-cross', svg);
  let tipEl = null;
  const show = e => {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = r.width / vb.width;
    const px = (e.clientX - r.left) / sx;
    let best = tips[0]; for (const t of tips) if (Math.abs(t.x - px) < Math.abs(best.x - px)) best = t;
    cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); cross.setAttribute('visibility', 'visible');
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tipbox'; box.appendChild(tipEl); }
    tipEl.textContent = best.t;
    const left = clamp(best.x * sx, 80, r.width - 80);
    tipEl.style.left = left + 'px'; tipEl.style.top = Math.max(16, best.y * sx) + 'px';
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); if (tipEl) { tipEl.remove(); tipEl = null; } };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

// ---------- sheets, dialogs, toast ----------
function syncScrollLock() { document.documentElement.classList.toggle('lock', !!$('.sheet-wrap,.dlg')); }
function sheet({ title, body, foot = '', cls = '' }) {
  const w = document.createElement('div');
  w.className = 'sheet-wrap ' + cls;
  w.innerHTML = `<div class="sheet-bg"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div><div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div>`;
  document.body.appendChild(w);
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  $('.sheet-bg', w).onclick = $('[data-close]', w).onclick = () => closeSheet(w);
  syncScrollLock();
  return w;
}
function closeSheet(w) { if (!w || w.closing) return; w.closing = true; w.classList.remove('open'); setTimeout(() => { w.remove(); syncScrollLock(); }, 220); }
function closeAllSheets() { $$('.sheet-wrap').forEach(closeSheet); }
function dialog({ title, body = '', actions = [{ label: 'OK', kind: 'primary' }], stack = false }) {
  return new Promise(res => {
    const w = document.createElement('div');
    w.className = 'dlg';
    w.innerHTML = `<div class="dlg-bg"></div><div class="dlg-box" role="alertdialog" aria-modal="true"><h3>${title}</h3><div class="dlg-body">${body}</div><div class="dlg-acts ${stack ? 'stack' : ''}">${actions.map((a, i) => `<button class="btn ${a.kind || ''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
    document.body.appendChild(w); syncScrollLock();
    const done = v => { w.remove(); syncScrollLock(); res(v); };
    $('.dlg-bg', w).onclick = () => done(-1);
    $$('[data-i]', w).forEach(b => b.onclick = () => done(+b.dataset.i));
  });
}
async function ask(msg, yes, kind = 'danger') { return (await dialog({ title: msg, actions: [{ label: 'Cancel' }, { label: yes, kind }] })) === 1; }
let toastTimer;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toastBtn">${esc(action.label)}</button>` : '');
  if (action) $('#toastBtn').onclick = () => { t.classList.remove('show'); action.fn(); };
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2600);
}

// ---------- add / edit food ----------
function recentFoods() {
  const c = {};
  for (let i = 0; i < 21; i++) for (const it of peekLog(addDays(-i)).items) if (FOOD[it.fid]) c[it.fid] = (c[it.fid] || 0) + 1;
  return Object.keys(c).sort((a, b) => c[b] - c[a]).slice(0, 8);
}
function foodRow(f) {
  const s = healthScore(f);
  return `<div class="frow" data-fid="${f.id}" role="button" tabindex="0"><span class="grow"><b>${esc(f.n)}</b><small class="num">${unitText(1, f.u)}${f.note ? ' (' + esc(f.note) + ')' : ''} · ${f.kcal} kcal · ${f.p} g protein</small></span><span class="badge ${scoreCls(s)}">${s}</span><button class="fadd" aria-label="Add 1 ${esc(f.u)} ${esc(f.n)}">${ic('plus')}</button></div>`;
}
function openAdd(slot) {
  let cur = slot || (viewDate === today() ? slotNow() : 'l');
  const date = viewDate;
  const w = sheet({ title: 'Add food', cls: 'tall', body: `
    <div class="chips" id="aSlots"></div>
    <div class="search">${ic('search')}<input id="fq" type="search" placeholder="Search rotli, dal, poha, chai…" autocomplete="off" enterkeyhint="search"></div>
    <div id="flist"></div>
    <button class="link-btn" id="customBtn">${ic('plus')} Can't find it? Add your own food</button>` });
  const drawSlots = () => { $('#aSlots', w).innerHTML = slotsFor(date).map(s => `<button class="chip ${s.k === cur ? 'on' : ''}" data-s="${s.k}">${s.n}</button>`).join(''); };
  const draw = () => {
    const q = $('#fq', w).value.trim().toLowerCase(), P = db.profile;
    let html = '';
    const ok = f => !P.jain || f.fl.includes('j') || f.custom;
    if (q) {
      const words = q.split(/\s+/);
      const hits = Object.values(FOOD).filter(f => words.every(x => (f.n + ' ' + f.al).toLowerCase().includes(x)))
        .sort((a, b) => (b.n.toLowerCase().startsWith(q) - a.n.toLowerCase().startsWith(q)) || (ok(b) - ok(a)));
      html = hits.length ? hits.slice(0, 40).map(foodRow).join('') : `<div class="empty">No match for "${esc(q)}". Add it as your own food below.</div>`;
    } else {
      const rec = recentFoods().map(id => FOOD[id]);
      if (rec.length) html += `<div class="flist-h">Recent</div>` + rec.map(foodRow).join('');
      const fast = !!peekLog(date).fast;
      const slotT = cur === 'p' ? 's' : cur;
      const forSlot = Object.values(FOOD).filter(f => !rec.includes(f) && ok(f) && (f.t || '').includes(slotT) && (!fast || f.fl.includes('v')));
      html += `<div class="flist-h">For ${SLOT[cur].n.toLowerCase()}</div>` + forSlot.map(foodRow).join('');
    }
    $('#flist', w).innerHTML = html;

function wirePicks(root) {

function readPf(root, p, groups) {
  const pick = n => { const g = $(`[data-pick="${n}"]`, root); return g ? $$('.on', g).map(x => x.dataset.v) : null; };
  const val = id => { const el = $('#' + id, root); return el ? el.value.trim() : null; };
  const num = id => { const v = val(id); return v == null ? null : parseFloat(v.replace(',', '.')); };
  if (groups.includes('you')) {
    const name = val('pf-name'), age = num('pf-age'), h = num('pf-h'), w = num('pf-w');
    if (!name) return 'Tell us your name';
    if (!(age >= 12 && age <= 90)) return 'Enter your age (12 to 90)';
    if (!(h >= 120 && h <= 220)) return 'Enter your height in cm (120 to 220)';
    if (!(w >= 30 && w <= 200)) return 'Enter your weight in kg';
    Object.assign(p, { name, age: r0(age), heightCm: r0(h), weightKg: Math.round(w * 10) / 10, gender: (pick('gender') || ['m'])[0] });
  }

    p.goal = (pick('goal') || ['fit'])[0];
    if (tw && !(tw >= 30 && tw <= 200)) return 'Goal weight looks off. Use kg, or leave it empty';
    p.targetKg = tw ? Math.round(tw * 10) / 10 : '';
  }
  if (groups.includes('move')) {
    p.activity = (pick('activity') || ['desk'])[0];
    p.exType = (pick('exType') || ['gym'])[0];
    p.exDays = (pick('exDays') || []).map(Number);
    p.exMins = +((pick('exMins') || [60])[0]);
    p.exTime = val('pf-ext') || '18:30';
    if (p.exType !== 'none' && !p.exDays.length) return 'Pick at least one workout day';
  }
  if (groups.includes('food')) {
    p.jain = $('#pf-jain', root).checked; p.whey = $('#pf-whey', root).checked;
    p.chai = (pick('chai') || ['sugar'])[0];
  }
  if (groups.includes('day')) { p.wake = val('pf-wake') || '07:00'; p.sleep = val('pf-sleep') || '23:00'; }
  return '';
}

// ---------- reminders ----------
// Plans the next few days of reminders. On the phone they become Android notifications
// (Capacitor LocalNotifications, rescheduled after every change); on the laptop preview they
// show as an in-app banner while the page is open.
function reminderPlan(days = 3) {
  const R = db.rem, P = db.profile, out = [], now = Date.now();
  if (!P) return out;
  const wake = toMin(P.wake); let sleep = toMin(P.sleep); if (sleep <= wake) sleep += 1440;
  for (let di = 0; di < days; di++) {
    const date = addDays(di), base = parseYmd(date).getTime(), dow = parseYmd(date).getDay();
    const at = m => base + m * 60000, isToday = di === 0, L = peekLog(date), T = targets(date);
    const push = (n, m, title, body, kind, action) => { const t = at(m); if (t > now + 20000) out.push({ id: di * 200 + n, at: t, title, body, kind, action }); };
    if (R.water.on && !(isToday && L.water >= T.water)) {
      const lines = ['A glass now beats a headache later.', 'Sip break. Your body is mostly water, top it up.', 'Paani time. One glass, then back to it.', 'Hydration check. Small sips count too.'];
      let n = 0;
      for (let m = wake + 60; m <= sleep - 60 && n < 30; m += +R.water.every, n++)
        push(1 + n, m, 'Water break', lines[n % lines.length] + (isToday ? ` You're at ${(L.water / 1000).toFixed(1)} of ${(T.water / 1000).toFixed(1)} L.` : ''), 'water', 'WATER');
    }
    if (R.meals.on) slotsFor(date).filter(s => s.k !== 'p').forEach((s, i) => {
      const plan = planMeal(date, s.k);
      push(40 + i, toMin(R.meals[s.k]), `${s.n} time`, `Today's idea: ${plan.name}. Tap to log it.`, 'meal:' + s.k);
    });
    if (R.workout.on && isWorkout(date) && !(isToday && L.done)) push(50, toMin(P.exTime), `${EX_NAME[P.exType]} time`, `Your ${P.exMins} min starts now. Future you says thanks.`, 'workout', 'WORKOUT');
    const wf = toMin(R.work.from), wt = toMin(R.work.to), weekday = dow >= 1 && dow <= 5;
    if (R.move.on && weekday) { let n = 0; for (let m = wf + +R.move.every; m < wt && n < 10; m += +R.move.every, n++) push(60 + n, m, 'Stretch break', 'Stand up, roll your shoulders, walk for 2 minutes.', 'move'); }
    if (R.eye.on && weekday) { let n = 0; for (let m = wf + 45; m < wt && n < 12; m += 60, n++) push(80 + n, m, 'Eye break', '20-20-20: look at something 20 feet away for 20 seconds.', 'eye'); }
    if (R.kitchen.on) push(100, sleep - R.kitchen.hrs * 60, 'Kitchen closed', `Try to finish eating ${R.kitchen.hrs} hours before bed. Your sleep will thank you.`, 'kitchen');
    if (R.sleep.on) push(101, sleep - 30, 'Wind down', 'Bed in 30 minutes. Phone down soon, okay?', 'sleep');
    if (R.weigh.on && dow === +R.weigh.day) push(102, wake + 15, 'Weigh-in day', 'Step on the scale before breakfast, then log it in NutriLoop.', 'weigh');
    if (R.protein.on) {
      const S = dayTotals(date);
      if (!isToday) push(103, toMin(R.protein.at), 'Protein check', 'How is your protein today? A katori of dahi or a handful of chana helps.', 'protein');
      else if (S.p < T.p * .5) push(103, toMin(R.protein.at), 'Protein check', `You're at ${r0(S.p)} of ${T.p} g. A katori of dahi or a handful of chana adds 4 to 7 g.`, 'protein');
    }
  }
  return out.sort((a, b) => a.at - b.at);
}
let syncTimer, webTimers = [];
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncNotifications, 1500); }
async function syncNotifications() {
  const plan = reminderPlan(3);
  const LN = plugin('LocalNotifications');
  if (LN) {
    try {
      const pend = await LN.getPending();
      if (pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
      if (plan.length) await LN.schedule({ notifications: plan.map(r => ({ id: r.id, title: r.title, body: r.body, schedule: { at: new Date(r.at), allowWhileIdle: true }, actionTypeId: r.action || '', extra: { kind: r.kind } })) });
    } catch (e) {}
    return;
  }
  webTimers.forEach(clearTimeout); webTimers = [];
  for (const r of plan) { const ms = r.at - Date.now(); if (ms < 6 * 3600e3) webTimers.push(setTimeout(() => showNbar(r), ms)); }
}
// Runs at every launch: action buttons must be registered each time; Android's permission
// prompt is shown once (after onboarding or a restore), later only from "Send a test reminder".
async function askNotifyPermission(force) {
  const LN = plugin('LocalNotifications'); if (!LN) return syncNotifications();
  try {
    const p = await LN.checkPermissions();
    if (p.display !== 'granted' && (force || !db.settings.askedNotify)) { db.settings.askedNotify = true; saveLocal(); await LN.requestPermissions(); }
    await LN.registerActionTypes({ types: [
      { id: 'WATER', actions: [{ id: 'drink', title: 'Drank a glass' }] },
      { id: 'WORKOUT', actions: [{ id: 'done', title: 'Done' }] },
    ] });
  } catch (e) {}

// ---------- Google sign-in + Drive backup (the user's own Drive, hidden app folder) ----------
// GoogleDrive.java (same plugin as Pocket Money) returns a short-lived token for the app folder.
const GD_FILE = 'nutriloop-backup.json', GD_API = 'https://www.googleapis.com';
let gdToken = null, gdTokenAt = 0, gdBusy = false, backupTimer;
async function gdAuth(interactive, profile) {
  if (!profile && gdToken && Date.now() - gdTokenAt < 45 * 60e3) return gdToken;
  const P = plugin('GoogleDrive');
  if (!P) throw Object.assign(new Error('Google sign-in works in the Android app'), { code: 'NO_PLUGIN' });
  const r = await P.authorize({ interactive: !!interactive, profile: !!profile });
  gdToken = r.accessToken; gdTokenAt = Date.now();
  if ((!r.email || (profile && !r.name)) && gdToken) {
    try { const u = await (await fetch(GD_API + '/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + gdToken } })).json(); r.email = r.email || u.email; r.name = r.name || u.name; r.photo = r.photo || u.picture; } catch (e) {}
  }
  if (r.email) db.account = Object.assign(db.account || {}, { email: r.email, name: r.name || (db.account && db.account.name) || '', photo: r.photo || (db.account && db.account.photo) || '' });
  return gdToken;
}
async function gdFetch(path, opts = {}, interactive = false) {
  const call = async () => fetch(GD_API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + await gdAuth(interactive) } });
  let res = await call();
  if (res.status === 401) { gdToken = null; res = await call(); }
  if (!res.ok) throw Object.assign(new Error('Google Drive error ' + res.status), { status: res.status });
  return res;
}
async function gdFind(interactive) {
  const q = encodeURIComponent(`name='${GD_FILE}'`);
  const r = await gdFetch(`/drive/v3/files?spaces=appDataFolder&q=${q}&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)`, {}, interactive);
  return ((await r.json()).files || [])[0] || null;
}
async function gdBackup(interactive) {
  if (gdBusy || !plugin('GoogleDrive')) return false;
  gdBusy = true;
  try {
    const body = JSON.stringify({ app: 'nutriloop', savedAt: new Date().toISOString(), data: db });
    let id = db.settings.gdFileId || ((await gdFind(interactive)) || {}).id;
    if (id) {
      try { await gdFetch(`/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }, interactive); }
      catch (e) { if (e.status === 404) id = null; else throw e; }
    }
    if (!id) {
      const b = 'nl' + Date.now();
      const parts = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: GD_FILE, parents: ['appDataFolder'] })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      id = (await (await gdFetch('/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: parts }, interactive)).json()).id;
    }
    Object.assign(db.settings, { gdFileId: id, gdLast: Date.now(), gdError: '' });
    saveLocal(); updGdRow();
    return true;
  } catch (e) {
    db.settings.gdError = e.code === 'NOT_SET_UP' ? 'Google setup not finished' : e.code === 'NEEDS_CONSENT' ? 'Tap to sign in again' : 'Last backup failed. Will retry.';
    saveLocal(); updGdRow(); throw e;
  } finally { gdBusy = false; }
}
async function gdRestore(silentIfNone) {
  const f = await gdFind(true);
  if (!f) { if (!silentIfNone) toast('No NutriLoop backup in this Google account yet'); return false; }
  const j = await (await gdFetch(`/drive/v3/files/${f.id}?alt=media`, {}, true)).json();
  const acc = db.account;
  db = migrate(j && j.data ? j.data : j); db.account = acc || db.account; db.settings.gdFileId = f.id; db.settings.gdOn = true;
  saveLocal(); indexFoods(); applyTheme();
  return true;
}
function scheduleBackup() { if (!db.settings.gdOn || !native) return; clearTimeout(backupTimer); backupTimer = setTimeout(() => gdBackup(false).catch(() => {}), 6000); }
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : shortDate(ymd(new Date(t))); };
function gdSubText() { const s = db.settings; return !s.gdOn ? 'Off' : !native ? 'Works in the Android app' : s.gdError ? s.gdError : s.gdLast ? `Backed up ${ago(s.gdLast)}` : 'Backing up…'; }

async function signIn(fromWelcome) {
  if (!plugin('GoogleDrive')) {
    // laptop preview: no Google on localhost, so use a stand-in account
    const ok = await dialog({ title: 'Preview sign-in', body: '<p>Real Google sign-in works in the Android app. In this laptop preview you continue with a sample account.</p>', actions: [{ label: 'Cancel' }, { label: 'Continue', kind: 'primary' }] });

  try { localStorage.setItem('nutriloop.boot', 'ok'); } catch (e) {}
  askNotifyPermission(); // also schedules the reminders
  if (native && db.settings.gdOn && (!db.settings.gdLast || Date.now() - db.settings.gdLast > 864e5)) gdBackup(false).catch(() => {});
}
function splash(done) {
  let seen = false;
  try { seen = sessionStorage.getItem('nl.splash') === '1'; sessionStorage.setItem('nl.splash', '1'); } catch (e) {}
  if (seen) return done();
  const s = $('#splash'); s.hidden = false;
  setTimeout(() => s.classList.add('out'), 1500);
  setTimeout(() => { s.hidden = true; s.classList.remove('out'); done(); }, 1850);
}

// Laptop preview only: sample data so every screen has something to show.
function demoDb() {
  const d = blank();
  d.profile = { name: 'Shyamal', gender: 'm', age: 27, heightCm: 173, weightKg: 69.4, goal: 'gain', targetKg: 72, activity: 'desk', exType: 'gym', exDays: [1, 2, 3, 4, 5, 6], exMins: 60, exTime: '18:30', jain: false, chai: 'sugar', whey: false, wake: '07:00', sleep: '23:30' };
  d.account = { email: 'preview@nutriloop.app', name: 'Shyamal', photo: '' };
  db = d; indexFoods();
  let kg = 68.2;
  for (let i = 27; i >= 0; i--) {
    const date = addDays(-i), L = getLog(date);
    if (i % 3 === 0) { kg += .1 + ((hash(date) % 7) - 2) / 20; d.weights.push({ date, kg: Math.round(kg * 10) / 10 }); }
    const slots = slotsFor(date).map(s => s.k).filter(k => i > 0 || k === 'b' || k === 'l');
    for (const k of slots) {
      if (i > 0 && hash(date + k) % 9 === 0) continue;
      const plan = planMeal(date, k);
      for (const it of plan.items) { const st = stepFor(FOOD[it.fid].u); addItem(date, it.fid, Math.max(st, it.q + ((hash(date + it.fid) % 3) - 1) * st), k, true); }
    }
    L.water = i ? 1750 + (hash(date + 'w') % 7) * 250 : 1250;
    if (isWorkout(date) && i > 0) L.done = hash(date + 'g') % 5 !== 0;
    if (i % 8 === 4) d.logs[addDays(-i)].swap = { l: 1 };
  }
  d.profile.weightKg = d.weights[d.weights.length - 1].kg;
  return d;
}

(function boot() {
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:';
  // ?fresh=1 = new install (onboarding); afterwards the preview stays sample-free until ?demo=1
  let noDemo = false; try { noDemo = localStorage.getItem('nutriloop.nodemo') === '1'; } catch (e) {}
  if (QS.get('fresh') === '1') {
    db = blank(); noDemo = true;
    try { localStorage.removeItem(KEY); localStorage.setItem('nutriloop.nodemo', '1'); sessionStorage.removeItem('nl.splash'); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  } else if (QS.get('demo') === '1' || (local && !db.profile && !noDemo)) {
    db = demoDb(); saveLocal();
    try { localStorage.removeItem('nutriloop.nodemo'); } catch (e) {}
    if (QS.get('demo') === '1') history.replaceState(null, '', location.pathname);
  }
  indexFoods(); applyTheme(); wireChrome();
  if (QS.get('tab')) tab = QS.get('tab');
  splash(() => {
    if (!db.profile) { $('#welcome').hidden = false; try { localStorage.setItem('nutriloop.boot', 'ok'); } catch (e) {} return; }
    showApp();
    if (tab !== 'home') go(tab);
    if (QS.get('open') === 'add') openAdd();
    if (QS.get('open') === 'reminders') openReminders();
    if (QS.get('open') === 'profile') openEditProfile();
  });
})();
</script>
